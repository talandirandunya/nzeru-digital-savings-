<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nzeru Dashboard Mockup</title>
    <style>
      :root {
        --bg: #efe9e2;
        --phone-shell: #f5f2ee;
        --deep-red: #8b0000;
        --deep-red-2: #760000;
        --nav-blue: #005b96;
        --nav-blue-dark: #003d63;
        --teal: #13c7b4;
        --white: #ffffff;
        --ink: #122033;
        --muted: #5d6c7a;
        --chip: rgba(255,255,255,0.09);
        --card-shadow: 0 18px 42px rgba(20, 20, 28, 0.12);
        --chart-bg: #121212;
        --chart-grid: rgba(255,255,255,0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      .screen {
        width: 420px;
        height: 900px;
        background: linear-gradient(180deg, var(--deep-red) 0%, var(--deep-red-2) 20%, #f7f6f4 20%, #f7f6f4 100%);
        border-radius: 34px;
        overflow: hidden;
        box-shadow: 0 26px 50px rgba(30, 14, 14, 0.2);
        position: relative;
      }

      .topbar {
        background: var(--nav-blue);
        color: var(--white);
        padding: 22px 18px 18px;
        min-height: 120px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .label {
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.8;
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: rgba(255,255,255,0.12);
        display: grid;
        place-items: center;
        font-weight: 700;
        border: 1px solid rgba(255,255,255,0.14);
      }

      .welcome {
        margin-top: 16px;
        font-size: 30px;
        letter-spacing: -0.05em;
        font-weight: 800;
      }

      .content {
        position: relative;
        z-index: 1;
        margin-top: -18px;
        padding: 0 16px 100px;
      }

      .panel {
        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 24px;
        box-shadow: var(--card-shadow);
      }

      .performance {
        background: linear-gradient(180deg, #a30000 0%, #850000 100%);
        color: var(--white);
        padding: 18px 18px 14px;
        border-radius: 24px;
        border: 1px solid rgba(255,255,255,0.1);
      }

      .small-label {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.8;
      }

      .performance-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.1);
        font-size: 12px;
        font-weight: 700;
      }

      .amount {
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 1;
      }

      .performance-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .trend {
        padding: 8px 10px;
        background: rgba(255,255,255,0.08);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }

      .chart-wrap {
        background: var(--chart-bg);
        border-radius: 18px;
        height: 210px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .chart-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, var(--chart-grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--chart-grid) 1px, transparent 1px);
        background-size: 34px 24px;
      }

      .chart-svg {
        width: 100%;
        height: 100%;
        display: block;
        position: relative;
        z-index: 1;
      }

      .stat-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 14px;
      }

      .stat-box {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        padding: 12px 8px;
      }

      .stat-box .label {
        font-size: 10px;
        opacity: 0.8;
      }

      .stat-box .value {
        margin-top: 8px;
        font-size: 19px;
        font-weight: 700;
      }

      .mini-cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 16px;
      }

      .mini-card {
        padding: 16px 14px;
        border-radius: 18px;
        background: linear-gradient(180deg, #a30000 0%, #760000 100%);
        color: var(--white);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .mini-card.light {
        background: linear-gradient(180deg, #9f0000 0%, #6d0000 100%);
      }

      .mini-card .label {
        font-size: 11px;
        opacity: 0.8;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .mini-card .value {
        margin-top: 12px;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.05em;
      }

      .mini-card .value.light {
        color: #ffe8ea;
      }

      .section-header {
        margin-top: 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--ink);
      }

      .section-header .title {
        font-size: 15px;
        font-weight: 700;
      }

      .section-header .meta {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }

      .plans {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }

      .plan-card {
        background: rgba(255,255,255,0.7);
        border: 1px solid rgba(18,32,51,0.08);
        border-radius: 18px;
        padding: 14px 12px;
      }

      .plan-card .title {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .plan-card .value {
        margin-top: 10px;
        font-size: 20px;
        font-weight: 800;
        color: var(--ink);
      }

      .plan-card .progress {
        margin-top: 10px;
        height: 6px;
        border-radius: 99px;
        background: #f0f2f4;
        overflow: hidden;
      }

      .plan-card .progress > span {
        display: block;
        height: 100%;
        width: 70%;
        background: linear-gradient(90deg, #8b0000, #a70d14);
        border-radius: inherit;
      }

      .bottom-nav {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 92px;
        background: var(--nav-blue);
        border-radius: 26px 26px 0 0;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        padding: 12px 16px 8px;
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: rgba(255,255,255,0.7);
        font-size: 11px;
        font-weight: 600;
      }

      .nav-item.active {
        color: white;
      }

      .nav-icon {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: rgba(255,255,255,0.08);
        display: grid;
        place-items: center;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="topbar">
        <div class="row">
          <div class="label">Good morning</div>
          <div class="avatar">K</div>
        </div>
        <div class="welcome">Welcome back</div>
      </div>

      <div class="content">
        <div class="performance">
          <div class="performance-head">
            <div class="small-label">Performance</div>
            <div class="chip">+12.4%</div>
          </div>

          <div class="performance-row">
            <div class="amount">MK 2.4M</div>
            <div class="trend">▲ 18.4%</div>
          </div>

          <div class="chart-wrap">
            <div class="chart-grid"></div>
            <svg class="chart-svg" viewBox="0 0 360 210" preserveAspectRatio="none">
              <defs>
                <linearGradient id="lineGlow" x1="0" x2="1">
                  <stop offset="0%" stop-color="#1be0d2"/>
                  <stop offset="100%" stop-color="#8aeed8"/>
                </linearGradient>
              </defs>

              <g opacity="0.9">
                <path d="M0,158 L42,146 L84,128 L126,140 L170,102 L214,88 L258,120 L300,68 L360,58 L360,210 L0,210 Z" fill="rgba(17,208,189,0.12)"/>
                <path d="M0,158 L42,146 L84,128 L126,140 L170,102 L214,88 L258,120 L300,68 L360,58" fill="none" stroke="url(#lineGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
              </g>

              <g fill="#f6f6f6" opacity="0.9">
                <rect x="28" y="144" width="18" height="42" rx="4"/>
                <rect x="68" y="120" width="18" height="66" rx="4"/>
                <rect x="110" y="132" width="18" height="54" rx="4"/>
                <rect x="152" y="96" width="18" height="90" rx="4"/>
                <rect x="194" y="80" width="18" height="106" rx="4"/>
                <rect x="238" y="108" width="18" height="78" rx="4"/>
                <rect x="280" y="62" width="18" height="124" rx="4"/>
                <rect x="320" y="74" width="18" height="112" rx="4"/>
              </g>
            </svg>
          </div>

          <div class="stat-row">
            <div class="stat-box">
              <div class="label">Income</div>
              <div class="value">1.4M</div>
            </div>
            <div class="stat-box">
              <div class="label">Expenses</div>
              <div class="value">840K</div>
            </div>
            <div class="stat-box">
              <div class="label">Savings</div>
              <div class="value">560K</div>
            </div>
          </div>
        </div>

        <div class="mini-cards">
          <div class="mini-card">
            <div class="label">Cash flow</div>
            <div class="value light">MK 868K</div>
            <div class="label" style="margin-top:10px; opacity: 0.9;">Up by 7.8%</div>
          </div>
          <div class="mini-card light">
            <div class="label">Loan health</div>
            <div class="value">82%</div>
            <div class="label" style="margin-top:10px; opacity: 0.9;">Stable record</div>
          </div>
        </div>

        <div class="section-header">
          <div class="title">Nzeru Savings Plans</div>
          <div class="meta">4 tracked</div>
        </div>

        <div class="plans">
          <div class="plan-card">
            <div class="title">Emergency</div>
            <div class="value">MK 540K</div>
            <div class="progress"><span></span></div>
          </div>
          <div class="plan-card">
            <div class="title">School</div>
            <div class="value">MK 310K</div>
            <div class="progress"><span style="width: 52%"></span></div>
          </div>
          <div class="plan-card">
            <div class="title">Home</div>
            <div class="value">MK 760K</div>
            <div class="progress"><span style="width: 88%"></span></div>
          </div>
          <div class="plan-card">
            <div class="title">Travel</div>
            <div class="value">MK 180K</div>
            <div class="progress"><span style="width: 40%"></span></div>
          </div>
        </div>
      </div>

      <div class="bottom-nav">
        <div class="nav-item active">
          <div class="nav-icon">⌂</div>
          <div>Home</div>
        </div>
        <div class="nav-item">
          <div class="nav-icon">◔</div>
          <div>Wallet</div>
        </div>
        <div class="nav-item">
          <div class="nav-icon">◫</div>
          <div>Goals</div>
        </div>
        <div class="nav-item">
          <div class="nav-icon">⚙</div>
          <div>More</div>
        </div>
      </div>
    </div>
  </body>
</html>
